name: Build Runtime Conditions Profile

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: build-runtime-conditions-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Built-in token commits do not trigger downstream push workflows.
          token: ${{ github.token }}
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install rc and the TypeScript profiler through APT
        run: |
          curl -fsSL https://runtimeconditions.github.io/packages/setup.sh | sudo sh
          sudo apt-get install --yes rc-cli rc-profiler-typescript
          rc --version
          rc plugins list

      - name: Install application dependencies and extension bindings
        run: npm --prefix app ci

      - name: Verify extension bindings
        run: rc profile typescript verify-bindings --project app

      - name: Generate the YAML profile
        env:
          WORKLOAD_URI: ${{ github.server_url }}/${{ github.repository }}
        run: |
          rc profile typescript generate \
            --project app \
            --name shipment-notifier \
            --workload-uri "$WORKLOAD_URI" \
            --workload-version "$GITHUB_SHA" \
            --out profile.yaml
          cat profile.yaml

      - name: Commit profile.yaml to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile.yaml
          if ! git diff --cached --quiet -- profile.yaml; then
            git commit -m "chore: generate Runtime Conditions Profile" -- profile.yaml
            if ! git push origin HEAD:refs/heads/main; then
              echo "Could not push profile.yaml. Check branch permissions; if main advanced, run this workflow again on main." >&2
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload profile.yaml
        id: profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: profile.yaml
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Link the generated profile
        env:
          ARTIFACT_URL: ${{ steps.profile.outputs.artifact-url }}
          PROFILE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          printf 'Committed root `profile.yaml` to `main` at `%s`, generated from `%s`.\n\n' "$PROFILE_COMMIT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Download [profile.yaml](%s).\n\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'When ready, run **Publish Runtime Conditions Profile** on `main` to submit the committed YAML.\n' >> "$GITHUB_STEP_SUMMARY"
