name: Build Runtime Conditions Profile

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install rc and the TypeScript profiler through APT
        run: |
          curl -fsSL https://runtimeconditions.github.io/packages/setup.sh | sudo sh
          sudo apt-get install --yes rc-cli rc-profiler-typescript
          rc --version
          rc plugins list

      - name: Install application dependencies and extension bindings
        run: npm --prefix app ci

      - name: Verify extension bindings
        run: rc profile typescript verify-bindings --project app

      - name: Generate the YAML profile
        env:
          WORKLOAD_URI: ${{ github.server_url }}/${{ github.repository }}
        run: |
          rc profile typescript generate \
            --project app \
            --name shipment-notifier \
            --workload-uri "$WORKLOAD_URI" \
            --workload-version "$GITHUB_SHA" \
            --out profile.yaml
          cat profile.yaml

      - name: Upload profile.yaml
        id: profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: profile.yaml
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Link the generated profile
        env:
          ARTIFACT_URL: ${{ steps.profile.outputs.artifact-url }}
        run: |
          printf 'Download [profile.yaml](%s), generated from commit `%s`.\n\n' "$ARTIFACT_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'To publish this profile, commit it as root `profile.yaml` on `main`, wait for **Build application image**, then run **Publish Runtime Conditions Profile**.\n' >> "$GITHUB_STEP_SUMMARY"
