name: Publish Runtime Conditions Profile

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: publish-runtime-conditions-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the committed YAML profile
        env:
          WORKLOAD_URI: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ ! -f profile.yaml ]; then
            echo "Commit profile.yaml to main before publishing." >&2
            exit 1
          fi
          yq -o=json profile.yaml |
            jq -e -s --arg uri "$WORKLOAD_URI" '
              length == 1 and
              .[0].apiVersion == "runtimeconditions.io/v1alpha1" and
              .[0].kind == "RuntimeConditionsProfile" and
              .[0].metadata.name == "shipment-notifier" and
              .[0].workload.uri == $uri
            ' > /dev/null

      # The platform role trusts this repository's main branch and only invokes the publisher.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Submit the committed profile to management Kubernetes
        env:
          FUNCTION_NAME: ${{ vars.PUBLISHER_FUNCTION_NAME }}
        run: |
          response="$(mktemp)"
          invocation="$(mktemp)"
          trap 'rm -f "$response" "$invocation"' EXIT
          yq -o=json profile.yaml |
            jq -c '{profile: .}' |
            aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --cli-binary-format raw-in-base64-out \
              --payload fileb:///dev/stdin \
              "$response" > "$invocation"
          if jq -e 'has("FunctionError")' "$invocation" > /dev/null; then
            cat "$response"
            exit 1
          fi
          jq -r '"Submitted \(.namespace)/\(.name), UID \(.uid)"' "$response"
          printf '\nProfile submitted successfully. Environment provisioning continues independently.\n' >> "$GITHUB_STEP_SUMMARY"
