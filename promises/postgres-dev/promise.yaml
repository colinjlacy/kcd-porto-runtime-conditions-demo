apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: postgres-dev
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: devpostgreses.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: DevPostgres
        plural: devpostgreses
        singular: devpostgres
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [source]
                  properties:
                    source:
                      type: object
                      description: RCProfile that requested this database.
                      required: [namespace, name, uid]
                      properties:
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                    databaseName:
                      type: string
                      default: app
                      pattern: ^[a-z][a-z0-9_]{0,62}$
                    storageSize:
                      type: string
                      default: 5Gi
                      pattern: ^[0-9]+(Mi|Gi|Ti)$
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-postgres-dev:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
