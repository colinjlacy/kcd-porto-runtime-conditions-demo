apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: postgres-dev
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: postgresdatabases.dev.platform.runtimeconditions.io
    spec:
      group: dev.platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: PostgresDatabase
        plural: postgresdatabases
        singular: postgresdatabase
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              description: >-
                A PostgreSQL database. The connection details are published as a Secret named after
                the request, with the service-binding keys type, host, port, database, username,
                password and uri. Request names must be unique within the cluster.
              properties:
                spec:
                  type: object
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-postgres-dev:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: POSTGRES_IMAGE
                    value: postgres:17-alpine
                  - name: STORAGE_SIZE
                    value: 5Gi
