apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: nats-dev
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: devnatses.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: DevNats
        plural: devnatses
        singular: devnats
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [source, stream, subject, consumer]
                  properties:
                    source:
                      type: object
                      description: RCProfile that requested this NATS access.
                      required: [namespace, name, uid]
                      properties:
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                    stream:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,64}$
                    subject:
                      type: string
                      pattern: ^[A-Za-z0-9_.*>-]{1,255}$
                    consumer:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,64}$
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-nats-dev:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: NATS_BROKER_URL
                    value: nats://nats.nats.svc.cluster.local:4222
                  - name: NATS_BOX_IMAGE
                    value: natsio/nats-box:0.14.5
