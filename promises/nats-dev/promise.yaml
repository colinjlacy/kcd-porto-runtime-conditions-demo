apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: nats-dev
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: natsstreams.dev.platform.runtimeconditions.io
    spec:
      group: dev.platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: NatsStream
        plural: natsstreams
        singular: natsstream
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              description: >-
                A JetStream stream with durable pull consumers on the environment's NATS broker. The
                connection details are published as a Secret named after the request, with the
                service-binding keys type, url, username, password, tls and stream. Request names
                must be unique within the cluster.
              properties:
                spec:
                  type: object
                  required: [stream, subjects]
                  properties:
                    stream:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,64}$
                    subjects:
                      type: array
                      minItems: 1
                      maxItems: 32
                      items:
                        type: string
                        pattern: ^[A-Za-z0-9_.*>-]{1,255}$
                    consumers:
                      type: array
                      maxItems: 32
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            pattern: ^[A-Za-z0-9_-]{1,64}$
                          filterSubject:
                            type: string
                            pattern: ^[A-Za-z0-9_.*>-]{1,255}$
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-nats-dev:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: NATS_BROKER_URL
                    value: nats://nats.nats.svc.cluster.local:4222
                  - name: NATS_BOX_IMAGE
                    value: natsio/nats-box:0.14.5
