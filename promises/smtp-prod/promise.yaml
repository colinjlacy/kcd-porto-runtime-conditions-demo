apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: smtp-prod
spec:
  destinationSelectors:
    - matchLabels:
        environment: production
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: emailsenders.production.platform.runtimeconditions.io
    spec:
      group: production.platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: EmailSender
        plural: emailsenders
        singular: emailsender
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              description: >-
                SMTP credentials that can send mail as one sender address, through Amazon SES. The
                connection details are published as a Secret named after the request, with the
                service-binding keys type, host, port, username, password, tlsMode and sender. The
                sender must be an SES identity the platform has verified. Request names must be
                unique within the cluster.
              properties:
                spec:
                  type: object
                  required: [sender]
                  properties:
                    sender:
                      type: string
                      pattern: ^[^\s@<>,;]+@[^\s@<>,;]+$
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              serviceAccount: smtp-prod
              permissions:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  resourceNames: ["promise-aws-config"]
                  verbs: ["get"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-smtp-prod:latest
                args: ["configure"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 1Gi
                    ephemeral-storage: 3Gi
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
      delete:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: delete
          spec:
            rbac:
              serviceAccount: smtp-prod
              permissions:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  resourceNames: ["promise-aws-config"]
                  verbs: ["get"]
            containers:
              - name: delete
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-smtp-prod:latest
                args: ["delete"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 1Gi
                    ephemeral-storage: 3Gi
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
