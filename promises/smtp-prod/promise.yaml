apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: smtp-prod
spec:
  destinationSelectors:
    - matchLabels:
        environment: production
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: prodsmtps.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: ProdSmtp
        plural: prodsmtps
        singular: prodsmtp
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [source, from, to]
                  properties:
                    source:
                      type: object
                      description: RCProfile that requested this SMTP access.
                      required: [namespace, name, uid]
                      properties:
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                    from:
                      type: string
                      description: Sender address; SES verifies it by email.
                      pattern: ^[^\s@<>,;]+@[^\s@<>,;]+$
                    to:
                      type: string
                      description: Recipient address; SES verifies it by email.
                      pattern: ^[^\s@<>,;]+@[^\s@<>,;]+$
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              serviceAccount: smtp-prod
              permissions:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  resourceNames: ["promise-aws-config"]
                  verbs: ["get"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-smtp-prod:latest
                args: ["configure"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 1Gi
                    ephemeral-storage: 3Gi
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
      delete:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: delete
          spec:
            rbac:
              serviceAccount: smtp-prod
              permissions:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  resourceNames: ["promise-aws-config"]
                  verbs: ["get"]
            containers:
              - name: delete
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-smtp-prod:latest
                args: ["delete"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 1Gi
                    ephemeral-storage: 3Gi
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
