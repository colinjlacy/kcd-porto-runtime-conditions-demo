apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: application
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: applications.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: Application
        plural: applications
        singular: application
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [source, environment]
                  properties:
                    source:
                      type: object
                      description: RCProfile that requested this deployment.
                      required: [namespace, name, uid]
                      properties:
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                    environment:
                      type: string
                      enum: [dev, production]
                    image:
                      type: string
                      description: Image reference, preferably with a digest. Without it only dependencies are provisioned.
                    replicas:
                      type: integer
                      default: 1
                      minimum: 1
                    dependencies:
                      type: array
                      description: Integrations the application waits for and reads its settings from.
                      items:
                        type: string
                        enum: [postgres, smtp, nats]
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-application:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: POSTGRES_CLIENT_IMAGE
                    value: postgres:17-alpine
                  - name: CURL_IMAGE
                    value: curlimages/curl:8.11.1
                  - name: NATS_BOX_IMAGE
                    value: natsio/nats-box:0.14.5
