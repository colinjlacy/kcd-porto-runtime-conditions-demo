apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: smtp-dev
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: emailsenders.dev.platform.runtimeconditions.io
    spec:
      group: dev.platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: EmailSender
        plural: emailsenders
        singular: emailsender
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              description: >-
                An SMTP server that captures mail sent as one sender address, backed by MailHog. The
                connection details are published as a Secret named after the request, with the
                service-binding keys type, host, port, username, password, tlsMode and sender.
                Request names must be unique within the cluster.
              properties:
                spec:
                  type: object
                  required: [sender]
                  properties:
                    sender:
                      type: string
                      pattern: ^[^\s@<>,;]+@[^\s@<>,;]+$
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-smtp-dev:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: MAILHOG_IMAGE
                    value: mailhog/mailhog:v1.0.1
