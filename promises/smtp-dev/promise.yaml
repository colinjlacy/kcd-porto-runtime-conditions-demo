apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: smtp-dev
spec:
  destinationSelectors:
    - matchLabels:
        environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: devsmtps.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: DevSmtp
        plural: devsmtps
        singular: devsmtp
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [source, from, to]
                  properties:
                    source:
                      type: object
                      description: RCProfile that requested this SMTP access.
                      required: [namespace, name, uid]
                      properties:
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                    from:
                      type: string
                      description: Sender address for notifications.
                      pattern: ^[^\s@<>,;]+@[^\s@<>,;]+$
                    to:
                      type: string
                      description: Recipient address for notifications.
                      pattern: ^[^\s@<>,;]+@[^\s@<>,;]+$
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-smtp-dev:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: MAILHOG_IMAGE
                    value: mailhog/mailhog:v1.0.1
