apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: postgres-prod
spec:
  destinationSelectors:
    - matchLabels:
        environment: production
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: prodpostgreses.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: ProdPostgres
        plural: prodpostgreses
        singular: prodpostgres
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [source]
                  properties:
                    source:
                      type: object
                      description: RCProfile that requested this database.
                      required: [namespace, name, uid]
                      properties:
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                    databaseName:
                      type: string
                      default: app
                      pattern: ^[a-z][a-z0-9_]{0,62}$
                    minCapacity:
                      type: number
                      default: 0.5
                      minimum: 0.5
                      maximum: 2
                    maxCapacity:
                      type: number
                      default: 2
                      minimum: 0.5
                      maximum: 2
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              serviceAccount: postgres-prod
              permissions:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  resourceNames: ["promise-aws-config"]
                  verbs: ["get"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-postgres-prod:latest
                args: ["configure"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 1Gi
                    ephemeral-storage: 3Gi
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
      delete:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: delete
          spec:
            rbac:
              serviceAccount: postgres-prod
              permissions:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  resourceNames: ["promise-aws-config"]
                  verbs: ["get"]
            containers:
              - name: delete
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-postgres-prod:latest
                args: ["delete"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 1Gi
                    ephemeral-storage: 3Gi
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
