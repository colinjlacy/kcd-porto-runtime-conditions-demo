apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: postgres-prod
spec:
  destinationSelectors:
    - matchLabels:
        environment: production
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: prodpostgreses.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: ProdPostgres
        plural: prodpostgreses
        singular: prodpostgres
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [source]
                  properties:
                    source:
                      type: object
                      description: RCProfile that requested this database.
                      required: [namespace, name, uid]
                      properties:
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create"]
                - apiGroups: [""]
                  resources: ["secrets"]
                  resourceNames: ["shared-postgres"]
                  resourceNamespace: platform-database
                  verbs: ["get"]
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-postgres-prod:latest
                args: ["configure"]
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: POSTGRES_ADMIN_NAMESPACE
                    value: platform-database
      delete:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: delete
          spec:
            rbac:
              permissions:
                - apiGroups: [""]
                  resources: ["secrets"]
                  resourceNames: ["shared-postgres"]
                  resourceNamespace: platform-database
                  verbs: ["get"]
            containers:
              - name: delete
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-postgres-prod:latest
                args: ["delete"]
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
                  - name: POSTGRES_ADMIN_NAMESPACE
                    value: platform-database
