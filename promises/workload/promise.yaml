apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: workload
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: workloads.platform.runtimeconditions.io
    spec:
      group: platform.runtimeconditions.io
      scope: Namespaced
      names:
        kind: Workload
        plural: workloads
        singular: workload
      versions:
        - name: v1alpha1
          served: true
          storage: true
          subresources:
            status: {}
          schema:
            openAPIV3Schema:
              type: object
              description: >-
                A Deployment delivered to the Destinations that match destinationLabels. Environment
                variables may reference Secrets in the workload's namespace, such as the binding
                Secrets of other requests. Checks run as init containers, in order, before the
                application starts. Request names must be unique within the cluster.
              properties:
                spec:
                  type: object
                  required: [destinationLabels, image]
                  properties:
                    destinationLabels:
                      type: object
                      minProperties: 1
                      additionalProperties:
                        type: string
                    image:
                      type: string
                      description: Image reference, preferably with a digest.
                    replicas:
                      type: integer
                      default: 1
                      minimum: 1
                    runAsUser:
                      type: integer
                      default: 1000
                      minimum: 1
                    env:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          value:
                            type: string
                          valueFrom:
                            type: object
                            required: [secretKeyRef]
                            properties:
                              secretKeyRef:
                                type: object
                                required: [name, key]
                                properties:
                                  name:
                                    type: string
                                  key:
                                    type: string
                    checks:
                      type: array
                      items:
                        type: object
                        required: [name, image, command]
                        properties:
                          name:
                            type: string
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          image:
                            type: string
                          command:
                            type: array
                            minItems: 1
                            items:
                              type: string
                          env:
                            type: array
                            items:
                              type: object
                              required: [name]
                              properties:
                                name:
                                  type: string
                                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                value:
                                  type: string
                                valueFrom:
                                  type: object
                                  required: [secretKeyRef]
                                  properties:
                                    secretKeyRef:
                                      type: object
                                      required: [name, key]
                                      properties:
                                        name:
                                          type: string
                                        key:
                                          type: string
                status:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
          spec:
            containers:
              - name: configure
                image: ghcr.io/colinjlacy/kcd-porto-runtime-conditions-demo/promise-workload:latest
                env:
                  - name: TARGET_NAMESPACE
                    value: application-support
