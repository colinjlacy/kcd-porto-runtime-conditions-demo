apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: shipment-notifications
workload:
  uri: https://github.com/colinjlacy/kcd-porto-runtime-conditions-demo
extensions:
  - https://runtimeconditions.io/extensions/nats/service:0.2.0
  - https://runtimeconditions.io/extensions/rc/common-integrations:v1alpha2
  - https://runtimeconditions.io/extensions/rc/env-configuration:v1alpha2
conditions:
  - kind: datastore
    interface:
      type: relational
      engine: postgres
    configuration:
      env:
        - name: DATABASE_URL
          property: url
          required: true
          sensitive: true
  - kind: api
    interface:
      type: smtp
      operations:
        - send
    configuration:
      env:
        - name: SMTP_HOST
          property: hostname
          required: true
        - name: SMTP_PORT
          property: port
          required: true
        - name: SMTP_USERNAME
          property: username
          required: true
        - name: SMTP_PASSWORD
          property: password
          required: true
          sensitive: true
        - name: SMTP_TLS_MODE
          property: tlsMode
          required: true
        - name: NOTIFICATION_FROM
          property: fromAddress
          required: true
        - name: NOTIFICATION_TO
          property: toAddress
          required: true
  - kind: nats.service
    interface:
      type: service
      operations:
        - resource: connection
          action: connect
        - resource: consumer
          action: consume
          stream: SHIPMENTS
          name: shipment-notifier
        - resource: subject
          action: subscribe
          subject: orders.shipped
    configuration:
      env:
        - name: NATS_URL
          property: url
          required: true
        - name: NATS_USERNAME
          property: username
          required: true
        - name: NATS_PASSWORD
          property: password
          required: true
          sensitive: true
        - name: NATS_TLS
          property: tls
        - name: NATS_STREAM
          property: stream
          required: true
        - name: NATS_SUBJECT
          property: subject
          required: true
        - name: NATS_CONSUMER
          property: consumer
          required: true
